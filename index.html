<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Pelé Academia — plataforma para descoberta, avaliação e conexão de talentos do futebol." />
    <meta name="theme-color" content="#0D1612" />
    <title>Pelé Academia | TIER-ZERO</title>
    <script>
      // Tema antes da 1ª pintura (sem flash): preferência salva > preferência do sistema.
      try {
        var saved = localStorage.getItem('ap_theme')
        document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      } catch (e) { document.documentElement.dataset.theme = 'dark' }
    </script>
    <link rel="icon" href="./assets/brand/simbolo.jpg" />
    <!-- Duas famílias variáveis: Bricolage Grotesque (títulos) + Instrument Sans (texto), display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Instrument+Sans:wght@400..600&display=swap" />
    <link rel="stylesheet" href="./assets/js/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <div id="app"></div>
    <!-- Abertura: fica no mínimo ~1,5 s na primeira visita da sessão (clique ou Esc pulam). -->
    <div id="splash" role="status" aria-live="polite"><div class="ball-loader"><div class="ball-stage" aria-hidden="true"><span class="ball-wrap"><svg viewBox="0 0 24 24" class="ball"><circle cx="12" cy="12" r="11" fill="#EEF1E8"/><path d="M12 7.2l4.1 3-1.6 4.8h-5l-1.6-4.8z" fill="#0D1612"/><path d="M12 7.2V2.5M16.1 10.2l4.4-1.6M14.5 15l2.8 3.9M9.5 15l-2.8 3.9M7.9 10.2 3.5 8.6" stroke="#0D1612" stroke-width="1.3" fill="none"/></svg></span><span class="ball-shadow"></span><span class="pitch-dash"></span></div><span class="text-sm text-ink-soft">Entrando em campo…</span></div><div class="splash-progress" aria-hidden="true"><span></span></div><span class="sr-only">Carregando a Pelé Academia</span></div>
    <!-- Avisos (toasts): fora do #app para sobreviver à troca de telas; anunciados por leitores de tela -->
    <div id="toast-root" role="status" aria-live="polite" class="pointer-events-none fixed bottom-24 right-5 md:bottom-5 z-[120] flex w-[min(92vw,380px)] flex-col gap-2"></div>
    <script type="module" src="./assets/js/main.js"></script>
  </body>
</html>
